name: finder_linux
description: "A macOS Finder-style file manager for Ubuntu."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: any
  path: ^1.9.0
  super_drag_and_drop: ^0.9.1
  super_clipboard: ^0.9.1
  crypto: ^3.0.8
  ffi: ^2.2.0
  super_native_extensions: ^0.9.1
  irondash_message_channel: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

# Patched copy (see third_party/irondash_message_channel, `_isolateIdObject`):
# lets several Flutter engines (Finder windows) share one process.
dependency_overrides:
  irondash_message_channel:
    path: third_party/irondash_message_channel
